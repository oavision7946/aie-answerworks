# Install once with `pre-commit install`. Each package is checked with its own environment
# (`make install` first), so the hooks run the same tools as `make lint`.
repos:
  - repo: local
    hooks:
      - id: ruff-api
        name: ruff (api)
        entry: bash -c 'cd api && uv run ruff check . && uv run ruff format --check .'
        language: system
        files: ^api/
        pass_filenames: false
      - id: ruff-ui
        name: ruff (ui)
        entry: bash -c 'cd ui && uv run ruff check . && uv run ruff format --check .'
        language: system
        files: ^ui/
        pass_filenames: false
      - id: mypy-api
        name: mypy (api)
        entry: bash -c 'cd api && uv run mypy app scripts'
        language: system
        files: ^api/
        pass_filenames: false
      - id: mypy-ui
        name: mypy (ui)
        entry: bash -c 'cd ui && uv run mypy app'
        language: system
        files: ^ui/
        pass_filenames: false

      - id: private-leak-check
        name: Block private or internal material
        entry: scripts/check_private_leaks.sh staged
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: private-leak-check-msg
        name: Block private terms in commit message
        entry: scripts/check_private_leaks.sh commit-msg
        language: script
        stages: [commit-msg]
