# Keyless configuration for the end-to-end test: only the built-in echo provider.
default_provider: fake

request:
  timeout_seconds: 60.0
  max_attempts: 1
  retry_base_delay_seconds: 0.1
  max_output_tokens: 4096

providers:
  fake:
    type: fake
    enabled: true
    default_model: echo
    models:
      - id: echo
        label: Echo (fake)
