name: UI CI

on:
  # Disabled for now (manual runs only). To re-enable, restore:
  # push:
  #   paths: ["ui/**", ".github/workflows/ui-ci.yml"]
  # pull_request:
  #   paths: ["ui/**", ".github/workflows/ui-ci.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: ui/uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
