name: API CI

on:
  # Disabled for now (manual runs only). To re-enable, restore:
  # push:
  #   paths: ["api/**", "config/**", ".github/workflows/api-ci.yml"]
  # pull_request:
  #   paths: ["api/**", "config/**", ".github/workflows/api-ci.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest
