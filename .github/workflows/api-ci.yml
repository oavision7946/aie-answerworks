name: API CI

on:
  # Disabled for now (manual runs only). To re-enable, restore:
  # push:
  #   paths: ["api/**", "config/**", ".github/workflows/api-ci.yml"]
  # pull_request:
  #   paths: ["api/**", "config/**", ".github/workflows/api-ci.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check . ../tests_e2e && uv run ruff format --check . ../tests_e2e
      - run: uv run mypy app scripts
      - run: uv run pytest
