# The placeholders in capitals are filled in from the environment when the container starts.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    authorization:
      credentials_file: /tmp/metrics_token
    static_configs: [{ targets: ["api:8000"] }]

  # Answers "is it reachable and ready" from outside the process.
  - job_name: probe
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["http://api:8000/health", "http://api:8000/health/ready", "http://ui:8501/_stcore/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]

  - job_name: tempo
    static_configs: [{ targets: ["tempo:3200"] }]

  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  # The model server (vLLM serves /metrics). Not part of Compose, so it may be absent.
  - job_name: vllm
    static_configs: [{ targets: ["__VLLM_TARGET__"] }]

  # scripts/gpu_exporter.py running on the host.
  - job_name: gpu
    static_configs: [{ targets: ["__GPU_TARGET__"] }]
